services:
  rss-morning:
    command: --config /app/configs/config.xml
    volumes:
      - ./configs:/app/configs:ro
      - ./feeds.xml:/app/feeds.xml:ro
      - ./prompt.md:/app/prompt.md:ro
      - ./queries.txt:/app/queries.txt:ro
    environment:
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: "no-reply@example.com"
      GOOGLE_API_KEY: ""
